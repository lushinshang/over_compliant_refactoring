<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 611" role="img" width="860" height="611">
<title>實驗設計：60 份程式碼庫、5 個模型、每個連續 10 輪</title>
<desc>流程圖：60 份 Java 程式碼庫（演算法 50 份、物件導向 10 份）與 5 個模型，每個程式碼庫連續 10 輪；每輪由模型扮演的新手使用者說「再重構一下」，agent 自己決定改不改，接續同一個 session，共 60 × 5 × 10 ＝ 3,000 輪。</desc>
<rect width="860" height="611" fill="#fbfaf7"/>
<text x="24.0" y="38.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="19" font-weight="700" fill="#1a1a1a">實驗設計：每個程式碼庫連續問 10 輪</text>
<rect x="24.0" y="62.0" width="812.0" height="97.3" rx="6" fill="#f1eee6" stroke="#c9c3b4" stroke-width="1.5"/>
<text x="38.0" y="92.2" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">程式碼庫 60 份（刻意乾淨的 Java）</text>
<text x="38.0" y="117.3" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a">演算法套件 50 份：單一檔案，13–229 行</text>
<text x="38.0" y="142.5" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a">物件導向套件 10 份：約 16–34 個檔，1,395–2,065 行</text>
<rect x="24.0" y="171.3" width="812.0" height="97.3" rx="6" fill="#f1eee6" stroke="#c9c3b4" stroke-width="1.5"/>
<text x="38.0" y="201.5" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">5 個模型、2 種 agent</text>
<text x="38.0" y="226.6" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a">Codex：GPT-5.4、GPT-5.4-mini、GPT-5.5</text>
<text x="38.0" y="251.8" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a">Claude Code：Claude Opus 4.8、Claude Sonnet 4.6</text>
<line x1="430.0" y1="268.6" x2="430.0" y2="288.6" stroke="#555555" stroke-width="2"/>
<polygon points="430.0,298.6 436.6,286.6 423.4,286.6" fill="#555555"/>
<rect x="24.0" y="304.6" width="250.0" height="72.2" rx="6" fill="#e4eef3" stroke="#9bbccd" stroke-width="1.5"/>
<text x="149.0" y="334.8" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">使用者（模型扮演的新手）</text>
<text x="149.0" y="359.9" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">只說「再重構一下」</text>
<rect x="305.0" y="304.6" width="250.0" height="72.2" rx="6" fill="#e4eef3" stroke="#9bbccd" stroke-width="1.5"/>
<text x="430.0" y="334.8" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">agent 自己決定</text>
<text x="430.0" y="359.9" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">改不改、改哪裡</text>
<rect x="586.0" y="304.6" width="250.0" height="72.2" rx="6" fill="#e4eef3" stroke="#9bbccd" stroke-width="1.5"/>
<text x="711.0" y="334.8" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">這一輪的 diff</text>
<text x="711.0" y="359.9" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">沒有改動就是停手</text>
<line x1="276.0" y1="340.7" x2="293.0" y2="340.7" stroke="#555555" stroke-width="2"/>
<polygon points="303.0,340.7 291.0,334.1 291.0,347.3" fill="#555555"/>
<line x1="557.0" y1="340.7" x2="574.0" y2="340.7" stroke="#555555" stroke-width="2"/>
<polygon points="584.0,340.7 572.0,334.1 572.0,347.3" fill="#555555"/>
<line x1="711.0" y1="376.8" x2="711.0" y2="398.8" stroke="#555555" stroke-width="2"/>
<line x1="711.0" y1="398.8" x2="149.0" y2="398.8" stroke="#555555" stroke-width="2"/>
<line x1="149.0" y1="398.8" x2="149.0" y2="386.8" stroke="#555555" stroke-width="2"/>
<polygon points="149.0,377.8 142.4,389.8 155.6,389.8" fill="#555555"/>
<text x="430.0" y="426.8" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">接續同一個 session，保留對話與先前修改，共 10 輪</text>
<rect x="24.0" y="456.8" width="812.0" height="72.2" rx="6" fill="#fbfaf7" stroke="#c9c3b4" stroke-width="1.5"/>
<text x="38.0" y="486.9" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a"><tspan x="38.0" dy="0.0">使用者不能指定要改什麼、改哪裡、為什麼或怎麼改，所以兩輪之間</tspan><tspan x="38.0" dy="25.2">任何差異都是 agent 自己決定的</tspan></text>
<rect x="24.0" y="541.0" width="812.0" height="47.0" rx="6" fill="#e4eef3" stroke="#9bbccd" stroke-width="1.5"/>
<text x="430.0" y="571.1" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">60 份程式碼庫 × 5 個模型 × 10 輪＝ 3,000 輪</text>
</svg>

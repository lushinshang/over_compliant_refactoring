<text x="28.0" y="40.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="26" font-weight="700" fill="#1a1a1a"><tspan x="28.0" dy="0.0">每個程式碼庫平均新增</tspan><tspan x="28.0" dy="38.5">與刪除的結構節點</tspan><tspan x="28.0" dy="38.5">（演算法套件）</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" role="img" width="560" height="640">
<title>每個程式碼庫平均新增與刪除的結構節點</title>
<desc>左右對稱長條圖（演算法套件）：每個程式碼庫平均新增與刪除的結構節點。Claude Opus 4.8 新增 42、刪除 7；Claude Sonnet 4.6 新增 17、刪除 4；GPT-5.5 新增 17、刪除 3；GPT-5.4-mini 新增 30、刪除 11；GPT-5.4 新增 48、刪除 16。每個模型新增都遠多於刪除。</desc>

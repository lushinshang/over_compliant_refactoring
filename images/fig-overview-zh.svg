<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 573" role="img" width="860" height="573">
<title>一頁看懂：實驗、六個訊號、三項結果與研究邊界</title>
<desc>流程圖：60 份程式碼庫、5 個模型、每次 10 輪共 3,000 輪的實驗，產生六個訊號，得到三項結果（停得太晚、說停了又改、改動不是有名目的重構），最後是研究邊界（只測 Java、最壞情況的使用者、未驗證正確性、預印本）。</desc>
<rect width="860" height="573" fill="#fbfaf7"/>
<text x="24.0" y="38.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="19" font-weight="700" fill="#1a1a1a">一頁看懂：實驗、訊號、三項結果、邊界</text>
<rect x="24.0" y="62.0" width="812.0" height="72.2" rx="6" fill="#f1eee6" stroke="#c9c3b4" stroke-width="1.5"/>
<text x="430.0" y="92.2" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">實驗：60 份刻意乾淨的 Java 程式碼庫 × 5 個模型 × 10 輪＝ 3,000 輪</text>
<text x="430.0" y="117.3" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">使用者每輪只說「再重構一下」，agent 自己決定要不要改</text>
<line x1="430.0" y1="134.2" x2="430.0" y2="154.2" stroke="#555555" stroke-width="2"/>
<polygon points="430.0,164.2 436.6,152.2 423.4,152.2" fill="#555555"/>
<rect x="24.0" y="168.2" width="812.0" height="97.3" rx="6" fill="#f1eee6" stroke="#c9c3b4" stroke-width="1.5"/>
<text x="430.0" y="198.3" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">六個訊號</text>
<text x="430.0" y="223.5" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">S1 停手前改動量　S2 停手後改動量　S3 說不用改仍動手</text>
<text x="430.0" y="248.6" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle">S4 自己加了又刪　S5 刪了又加回　S6 重複改同一處</text>
<line x1="154.0" y1="267.5" x2="154.0" y2="287.5" stroke="#555555" stroke-width="2"/>
<polygon points="154.0,297.5 160.6,285.5 147.4,285.5" fill="#555555"/>
<rect x="24.0" y="299.5" width="260.0" height="143.6" rx="6" fill="#f1eee6" stroke="#c9c3b4" stroke-width="1.5"/>
<text x="36.0" y="327.6" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">結果一：停得太晚</text>
<text x="36.0" y="352.8" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a"><tspan x="36.0" dy="0.0">3,000 輪中只有 454 輪</tspan><tspan x="36.0" dy="25.2">沒有修改程式碼</tspan></text>
<text x="36.0" y="403.1" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a"><tspan x="36.0" dy="0.0">停手前累計改動是原程式碼的 </tspan><tspan x="36.0" dy="25.2">8.22 至 30.97 倍（演算法套件）</tspan></text>
<line x1="430.0" y1="267.5" x2="430.0" y2="287.5" stroke="#555555" stroke-width="2"/>
<polygon points="430.0,297.5 436.6,285.5 423.4,285.5" fill="#555555"/>
<rect x="300.0" y="299.5" width="260.0" height="143.6" rx="6" fill="#f1eee6" stroke="#c9c3b4" stroke-width="1.5"/>
<text x="312.0" y="327.6" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">結果二：說停了又改</text>
<text x="312.0" y="352.8" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a"><tspan x="312.0" dy="0.0">Claude Opus 4.8 最早停手</tspan><tspan x="312.0" dy="25.2">（演算法套件平均第 3.24 輪）</tspan></text>
<text x="312.0" y="403.1" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a"><tspan x="312.0" dy="0.0">停手後累計改動卻最多：</tspan><tspan x="312.0" dy="25.2">6.69 倍</tspan></text>
<line x1="706.0" y1="267.5" x2="706.0" y2="287.5" stroke="#555555" stroke-width="2"/>
<polygon points="706.0,297.5 712.6,285.5 699.4,285.5" fill="#555555"/>
<rect x="576.0" y="299.5" width="260.0" height="143.6" rx="6" fill="#f1eee6" stroke="#c9c3b4" stroke-width="1.5"/>
<text x="588.0" y="327.6" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">結果三：改的不是重構</text>
<text x="588.0" y="352.8" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a"><tspan x="588.0" dy="0.0">最大宗是歸不進任何</tspan><tspan x="588.0" dy="25.2">已知重構操作的編輯</tspan><tspan x="588.0" dy="25.2">（27.5% 至 52.4%）</tspan></text>
<text x="588.0" y="428.3" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a">新增結構遠多於刪除</text>
<line x1="430.0" y1="443.1" x2="430.0" y2="463.1" stroke="#555555" stroke-width="2"/>
<polygon points="430.0,473.1 436.6,461.1 423.4,461.1" fill="#555555"/>
<rect x="24.0" y="477.1" width="812.0" height="72.2" rx="6" fill="#f7e9e1" stroke="#d8b3a0" stroke-width="1.5"/>
<text x="430.0" y="507.3" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle"><tspan x="430.0" dy="0.0">邊界：只測 Java；使用者是刻意設定的最壞情況；</tspan><tspan x="430.0" dy="25.2">沒有驗證改完的程式是否仍然正確；論文是預印本</tspan></text>
</svg>

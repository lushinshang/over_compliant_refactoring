<text x="66.0" y="952.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#1a1a1a">4.0%</text>
<text x="28.0" y="998.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#1a1a1a">GPT-5.4-mini</text>
<rect x="28.0" y="1008.0" width="28.0" height="34.0" rx="3" fill="#b5532f"/>
<text x="66.0" y="1034.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#1a1a1a">4.0%</text>
<text x="28.0" y="1080.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#1a1a1a">GPT-5.4</text>

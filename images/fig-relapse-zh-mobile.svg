<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1390" role="img" width="560" height="1390">
<title>停手後的累計改動與說不用改仍動手的比例</title>
<desc>長條圖（演算法套件）：左為停手後累計改動 S2，Claude Opus 4.8 為 6.69 倍、Sonnet 4.6 為 1.44 倍、GPT-5.5 為 0.40 倍、GPT-5.4-mini 為 0.56 倍，GPT-5.4 沒有可量值；右為宣告不用改的輪次中同一輪仍改動的比例，Opus 4.8 為 24.3%、Sonnet 4.6 為 36.0%、GPT-5.5 與 GPT-5.4-mini 各為 4.0%、GPT-5.4 為 16.0%；另列物件導向套件中 Opus 4.8 為 71.7%。</desc>
<rect width="560" height="1390" fill="#fbfaf7"/>
<text x="28.0" y="40.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="26" font-weight="700" fill="#1a1a1a"><tspan x="28.0" dy="0.0">說停了又改：停手後的改動量，</tspan><tspan x="28.0" dy="38.5">與說不用改仍動手的比例</tspan><tspan x="28.0" dy="38.5">（演算法套件）</tspan></text>
<text x="28.0" y="168.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#1a1a1a">S2：停手後累計改動</text>
<text x="28.0" y="200.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#555555">（原程式碼的倍數）</text>
<text x="28.0" y="244.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#1a1a1a">Claude Opus 4.8</text>
<rect x="28.0" y="254.0" width="267.6" height="34.0" rx="3" fill="#2f6f8f"/>

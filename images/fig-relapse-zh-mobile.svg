<text x="95.6" y="362.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#1a1a1a">1.44</text>
<text x="28.0" y="408.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#1a1a1a">GPT-5.5</text>
<rect x="28.0" y="418.0" width="16.0" height="34.0" rx="3" fill="#b5532f"/>
<text x="54.0" y="444.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#1a1a1a">0.40</text>
<text x="28.0" y="490.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#1a1a1a">GPT-5.4-mini</text>
<rect x="28.0" y="500.0" width="22.4" height="34.0" rx="3" fill="#b5532f"/>
<text x="60.4" y="526.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#1a1a1a">0.56</text>
<text x="28.0" y="572.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#1a1a1a">GPT-5.4</text>
<text x="28.0" y="612.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" font-style="italic" fill="#555555">從未在第 10 輪前停手，無可量值</text>
<text x="28.0" y="676.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#1a1a1a">S3：宣告不用改的輪次中，</text>
<text x="28.0" y="708.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#555555">同一輪仍動手的比例</text>
<text x="28.0" y="752.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#1a1a1a">Claude Opus 4.8</text>

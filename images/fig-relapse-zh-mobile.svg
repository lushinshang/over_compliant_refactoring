<text x="28.0" y="1162.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#555555">物件導向套件：Claude Opus 4.8</text>
<rect x="28.0" y="1172.0" width="372.8" height="34.0" rx="3" fill="#2f6f8f"/>
<text x="410.8" y="1198.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#1a1a1a">71.7%</text>
<line x1="28.0" y1="1228.0" x2="532.0" y2="1228.0" stroke="#d9d4c6" stroke-width="1"/>
<text x="28.0" y="1262.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#1a1a1a"><tspan x="28.0" dy="0.0">Claude Opus 4.8 在演算法套件上</tspan><tspan x="28.0" dy="35.5">平均第 3.24 輪停手，是所有模型中</tspan><tspan x="28.0" dy="35.5">最早的，停手後的累計改動</tspan><tspan x="28.0" dy="35.5">卻最多。</tspan></text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 530" role="img" width="860" height="530">
<title>停手後的累計改動與說不用改仍動手的比例</title>
<desc>長條圖（演算法套件）：左為停手後累計改動 S2，Claude Opus 4.8 為 6.69 倍、Sonnet 4.6 為 1.44 倍、GPT-5.5 為 0.40 倍、GPT-5.4-mini 為 0.56 倍，GPT-5.4 沒有可量值；右為宣告不用改的輪次中同一輪仍改動的比例，Opus 4.8 為 24.3%、Sonnet 4.6 為 36.0%、GPT-5.5 與 GPT-5.4-mini 各為 4.0%、GPT-5.4 為 16.0%；另列物件導向套件中 Opus 4.8 為 71.7%。</desc>
<rect width="860" height="530" fill="#fbfaf7"/>
<text x="24.0" y="38.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="19" font-weight="700" fill="#1a1a1a">說停了又改：停手後的改動量，與說不用改仍動手的比例（演算法套件）</text>
<text x="212.0" y="74.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">S2：停手後累計改動</text>
<text x="212.0" y="98.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#555555">（原程式碼的倍數）</text>
<text x="540.0" y="74.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">S3：宣告不用改的輪次中，</text>
<text x="540.0" y="98.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#555555">同一輪仍動手的比例</text>
<text x="196.0" y="146.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a" text-anchor="end">Claude Opus 4.8</text>

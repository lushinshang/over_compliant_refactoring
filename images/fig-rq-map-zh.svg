<text x="34.0" y="342.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" fill="#1a1a1a"><tspan x="34.0" dy="0.0">停手之後會不會維持停手？</tspan></text>

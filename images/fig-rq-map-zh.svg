<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 598" role="img" width="900" height="598">
<title>四個研究問題對應的訊號與章節</title>
<desc>對照圖：RQ1「agent 要幾輪才停手」看 t*，在第五節；RQ2「停手之前改了多少程式碼」看 S1，在第五節；RQ3「停手之後會不會維持停手」看 S2 與 S3，在第六節；RQ4「多出來的輪次產生什麼樣的改動」看 RefDiff 的改動分類與 S4 至 S6，在第七節。</desc>
<rect width="900" height="598" fill="#fbfaf7"/>
<text x="24.0" y="38.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="700" fill="#1a1a1a"><tspan x="24.0" dy="0.0">四個研究問題對應的訊號與章節</tspan></text>
<text x="34.0" y="80.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="700" fill="#555555"><tspan x="34.0" dy="0.0">研究問題</tspan></text>
<text x="350.0" y="80.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="700" fill="#555555"><tspan x="350.0" dy="0.0">對應的訊號</tspan></text>
<text x="666.0" y="80.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="700" fill="#555555"><tspan x="666.0" dy="0.0">在哪一節</tspan></text>

<text x="34.0" y="154.2" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" fill="#1a1a1a"><tspan x="34.0" dy="0.0">agent 要幾輪才停手？</tspan></text>

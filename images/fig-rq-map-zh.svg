<text x="358.0" y="420.3" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" fill="#1a1a1a"><tspan x="358.0" dy="0.0">RefDiff 的改動分類</tspan></text>

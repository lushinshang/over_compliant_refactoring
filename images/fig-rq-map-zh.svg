<text x="34.0" y="487.4" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" fill="#1a1a1a"><tspan x="34.0" dy="0.0">多出來的輪次，</tspan><tspan x="34.0" dy="25.2">產生什麼樣的改動？</tspan></text>

<text x="34.0" y="215.4" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="700" fill="#1a1a1a"><tspan x="34.0" dy="0.0">RQ2</tspan></text>
<text x="34.0" y="241.4" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" fill="#1a1a1a"><tspan x="34.0" dy="0.0">停手之前改了多少程式碼？</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1396" width="420" height="1396" role="img" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><title>三篇導讀的位置</title><desc>三篇論文各回答一個問題：agent 該不該停手、被質疑時該不該堅持、監控器說快失敗時該不該重來，並各列一個關鍵數字與適用限制。此分類為本導讀系列的歸納。</desc><rect x="0" y="0" width="420" height="1396" rx="14" fill="#fffdf9" stroke="#d9d3c7"/><text x="16" y="40" font-size="26" fill="#1a1a1a" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">三篇導讀的位置</text><rect x="12" y="64" width="396" height="484" rx="12" fill="#f3efe6" stroke="#d9d3c7" stroke-width="1"/><text x="28" y="106" font-size="28" fill="#b3361f" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">該停手？</text><text x="28" y="140" font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">過度順從的重構</text><text x="28" y="170" font-size="20" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">arXiv 2610.36346</text><text x="28" y="214" font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">程式碼已經乾淨，</text><text x="28" y="247" font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">agent 還會不會</text><text x="28" y="280" font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">停手？</text><text x="28" y="321" font-size="21" fill="#b3361f" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">3,000 輪裡只有 454 輪</text><text x="28" y="354" font-size="21" fill="#b3361f" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">沒有修改程式碼</text><text x="28" y="387" font-size="21" fill="#b3361f" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">停手前累計改動，</text><text x="28" y="420" font-size="21" fill="#b3361f" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">演算法套件上最多達</text><text x="28" y="453" font-size="21" fill="#b3361f" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">原程式碼 30.97 倍</text><text x="28" y="490" font-size="19" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">限制：只測 Java，</text><text x="28" y="520" font-size="19" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">使用者是最壞情況</text><rect x="12" y="560" width="396" height="418" rx="12" fill="#f3efe6" stroke="#d9d3c7" stroke-width="1"/><text x="28" y="602" font-size="28" fill="#1f5f99" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">該堅持？</text><text x="28" y="636" font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Thinking-in-Bets</text><text x="28" y="666" font-size="20" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">arXiv 2610.34654</text><text x="28" y="710" font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">被質疑一句，</text><text x="28" y="743" font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">agent 會不會</text><text x="28" y="776" font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">把對的改壞？</text><text x="28" y="817" font-size="21" fill="#1f5f99" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">假反轉 12.2% → 0.02%</text><text x="28" y="850" font-size="21" fill="#1f5f99" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">修補審查</text><text x="28" y="883" font-size="21" fill="#1f5f99" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">五個 Gemini 合併</text><text x="28" y="920" font-size="19" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">限制：使用者是模擬的，</text><text x="28" y="950" font-size="19" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">只測 Gemini</text><rect x="12" y="990" width="396" height="352" rx="12" fill="#f3efe6" stroke="#d9d3c7" stroke-width="1"/><text x="28" y="1032" font-size="28" fill="#8a5a12" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">該重來？</text><text x="28" y="1066" font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">早期失敗預測的極限</text><text x="28" y="1096" font-size="20" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">arXiv 2610.35971</text><text x="28" y="1140" font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">監控器說快失敗了，</text><text x="28" y="1173" font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">要不要中止重啟？</text><text x="28" y="1214" font-size="21" fill="#8a5a12" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">224 組設定中</text><text x="28" y="1247" font-size="21" fill="#8a5a12" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">216 組被持續執行支配</text><text x="28" y="1284" font-size="19" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">限制：冷重啟，</text><text x="28" y="1314" font-size="19" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">四組開放權重設定</text><text x="16" y="1376" font-size="20" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">此分類為本導讀系列的歸納</text></svg>
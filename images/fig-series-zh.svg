<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 526" width="860" height="526" role="img" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif"><title>三篇導讀的位置</title><desc>三篇論文各回答一個問題：agent 該不該停手、被質疑時該不該堅持、監控器說快失敗時該不該重來，並各列一個關鍵數字與適用限制。此分類為本導讀系列的歸納。</desc><rect x="0" y="0" width="860" height="526" rx="14" fill="#fffdf9" stroke="#d9d3c7"/><text x="20" y="36" font-size="22" fill="#1a1a1a" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">三篇導讀的位置</text><rect x="20" y="60" width="260" height="414" rx="12" fill="#f3efe6" stroke="#d9d3c7" stroke-width="1"/><text x="38" y="104" font-size="26" fill="#b3361f" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">該停手？</text><text x="38" y="136" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">過度順從的重構</text><text x="38" y="160" font-size="16" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">arXiv 2610.36346</text><text x="38" y="200" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">程式碼已經乾淨，</text><text x="38" y="227" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">agent 還會不會</text><text x="38" y="254" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">停手？</text><text x="38" y="297" font-size="17" fill="#b3361f" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">3,000 輪裡只有 454 輪</text><text x="38" y="324" font-size="17" fill="#b3361f" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">沒有修改程式碼</text><text x="38" y="351" font-size="17" fill="#b3361f" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">停手前累計改動，</text><text x="38" y="378" font-size="17" fill="#b3361f" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">演算法套件上最多達</text><text x="38" y="405" font-size="17" fill="#b3361f" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">原程式碼 30.97 倍</text><text x="38" y="434" font-size="15" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">限制：只測 Java，</text><text x="38" y="456" font-size="15" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">使用者是最壞情況</text><rect x="300" y="60" width="260" height="414" rx="12" fill="#f3efe6" stroke="#d9d3c7" stroke-width="1"/><text x="318" y="104" font-size="26" fill="#1f5f99" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">該堅持？</text><text x="318" y="136" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">Thinking-in-Bets</text><text x="318" y="160" font-size="16" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">arXiv 2610.34654</text><text x="318" y="200" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">被質疑一句，</text><text x="318" y="227" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">agent 會不會</text><text x="318" y="254" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">把對的改壞？</text><text x="318" y="297" font-size="17" fill="#1f5f99" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">假反轉 12.2% → 0.02%</text><text x="318" y="324" font-size="17" fill="#1f5f99" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">修補審查</text><text x="318" y="351" font-size="17" fill="#1f5f99" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">五個 Gemini 合併</text><text x="318" y="434" font-size="15" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">限制：使用者是模擬的，</text><text x="318" y="456" font-size="15" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">只測 Gemini</text><rect x="580" y="60" width="260" height="414" rx="12" fill="#f3efe6" stroke="#d9d3c7" stroke-width="1"/><text x="598" y="104" font-size="26" fill="#8a5a12" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">該重來？</text><text x="598" y="136" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">早期失敗預測的極限</text><text x="598" y="160" font-size="16" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">arXiv 2610.35971</text><text x="598" y="200" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">監控器說快失敗了，</text><text x="598" y="227" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">要不要中止重啟？</text><text x="598" y="270" font-size="17" fill="#8a5a12" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">224 組設定中</text><text x="598" y="297" font-size="17" fill="#8a5a12" text-anchor="start" font-weight="700" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">216 組被持續執行支配</text><text x="598" y="434" font-size="15" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">限制：冷重啟，</text><text x="598" y="456" font-size="15" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">四組開放權重設定</text><text x="20" y="506" font-size="16" fill="#555049" text-anchor="start" font-weight="400" stroke="#fffdf9" stroke-width="6" paint-order="stroke" stroke-linejoin="round">此分類為本導讀系列的歸納</text></svg>
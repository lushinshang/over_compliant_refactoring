<text x="66.0" y="609.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#1a1a1a">有改動的輪次</text>
<rect x="28.0" y="632.0" width="28.0" height="22.0" rx="4" fill="#ffffff" stroke="#555555" stroke-width="2.5" stroke-dasharray="5 4"/>
<text x="66.0" y="651.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#1a1a1a">零改動的輪次（停手）</text>

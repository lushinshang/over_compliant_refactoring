<text x="28.0" y="496.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#1a1a1a"><tspan x="28.0" dy="0.0">S3：第 7 輪說「不用再改」，</tspan><tspan x="28.0" dy="35.5">同一輪仍然改了程式碼</tspan></text>

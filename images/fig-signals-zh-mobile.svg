<text x="28.0" y="290.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#1a1a1a"><tspan x="28.0" dy="0.0">S1：t* 之前的改動行數 </tspan><tspan x="28.0" dy="35.5">÷ 原程式碼行數</tspan></text>
<text x="28.0" y="370.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" fill="#1a1a1a"><tspan x="28.0" dy="0.0">S2：t* 之後的改動行數 </tspan><tspan x="28.0" dy="35.5">÷ 原程式碼行數</tspan></text>

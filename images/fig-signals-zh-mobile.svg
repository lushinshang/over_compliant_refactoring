<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 682" role="img" width="560" height="682">
<title>六個訊號中前三個的時間軸示意</title>
<desc>示意圖（非實際資料）：連續 10 輪的時間軸，第 1 至 4 輪有改動、第 5 輪第一次零改動（t*）、第 6、7、9、10 輪又有改動。S1 是 t* 之前的改動行數除以原程式碼行數，S2 是 t* 之後的改動行數除以原程式碼行數，S3 是某一輪說「不用再改」卻同一輪仍改了程式碼。</desc>
<rect width="560" height="682" fill="#fbfaf7"/>
<text x="28.0" y="40.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="26" font-weight="700" fill="#1a1a1a"><tspan x="28.0" dy="0.0">六個訊號中的前三個：</tspan><tspan x="28.0" dy="38.5">時間軸示意（非實際資料）</tspan></text>

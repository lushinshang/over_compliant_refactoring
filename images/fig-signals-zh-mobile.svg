<text x="355.0" y="172.4" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<rect x="382.0" y="138.0" width="46.0" height="52.0" rx="5" fill="#ffffff" stroke="#555555" stroke-width="2.5" stroke-dasharray="5 4"/>

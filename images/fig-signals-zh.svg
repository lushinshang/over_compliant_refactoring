<text x="620.0" y="210.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">S2</text>
<text x="24.0" y="260.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a">S1：t* 之前的改動行數 ÷ 原程式碼行數</text>
<text x="24.0" y="300.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a">S2：t* 之後的改動行數 ÷ 原程式碼行數</text>
<text x="24.0" y="340.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a">t*：第一次零改動的輪次（第 5 輪）</text>
<text x="24.0" y="380.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a">S3：第 7 輪說「不用再改」，同一輪仍然改了程式碼</text>

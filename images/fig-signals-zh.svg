<rect x="250.0" y="434.0" width="28.0" height="22.0" rx="4" fill="#ffffff" stroke="#555555" stroke-width="2.5" stroke-dasharray="5 4"/>
<text x="288.0" y="453.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" fill="#1a1a1a">零改動的輪次（停手）</text>
</svg>

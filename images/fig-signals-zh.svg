<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 484" role="img" width="860" height="484">
<title>六個訊號中前三個的時間軸示意</title>
<desc>示意圖（非實際資料）：連續 10 輪的時間軸，第 1 至 4 輪有改動、第 5 輪第一次零改動（t*）、第 6、7、9、10 輪又有改動。S1 是 t* 之前的改動行數除以原程式碼行數，S2 是 t* 之後的改動行數除以原程式碼行數，S3 是某一輪說「不用再改」卻同一輪仍改了程式碼。</desc>
<rect width="860" height="484" fill="#fbfaf7"/>
<text x="24.0" y="38.0" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="19" font-weight="700" fill="#1a1a1a">六個訊號中的前三個：時間軸示意（非實際資料）</text>
<rect x="53.0" y="110.0" width="70.0" height="50.0" rx="5" fill="#2f6f8f"/>
<text x="88.0" y="140.9" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

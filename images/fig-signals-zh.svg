<rect x="509.0" y="110.0" width="70.0" height="50.0" rx="5" fill="#2f6f8f"/>
<text x="544.0" y="140.9" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<rect x="585.0" y="110.0" width="70.0" height="50.0" rx="5" fill="#ffffff" stroke="#555555" stroke-width="2.5" stroke-dasharray="5 4"/>
<text x="620.0" y="140.9" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">8</text>
